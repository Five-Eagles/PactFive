name: CI

# 2026-09-07 최초 작성 — 이전까지 이 파일은 초기 스캐폴드 이후 계속 빈 파일이었다
# (docs/decisions/0010-daily-session-branch-enforcement.md §1·§5가 이미 이 공백을 "남은
# 리스크"로 기록해 두었다). 지금은 develop 미동기화 브랜치를 서버(GitHub) 쪽에서도 걸러내는
# 체크 하나만 넣는다 — scripts/git-hooks/pre-push의 두 번째 검사(로컬)와 판단 기준이 동일한
# 서버 쪽 대응.
#
# 로컬 훅(pre-push)은 `git push --no-verify`로 우회되거나, core.hooksPath가 안 잡힌 환경에서는
# 애초에 실행되지 않는다. 이 워크플로우는 PR이 GitHub에 올라온 뒤 서버에서 다시 확인하므로
# 그 두 가지 우회 경로를 막는 마지막 안전망 역할을 한다 — 단, 이 체크만으로 merge 자체를
# 막으려면 GitHub 저장소 설정에서 develop 브랜치에 "Require status checks to pass before
# merging"을 켜고 이 체크를 필수로 지정해야 한다(저장소 admin 권한 필요, AI가 대신 할 수
# 없음 — ADR-0010 §4 "GitHub 저장소 설정(팀장이 직접 진행)"과 동일한 제약).
#
# Public repo라 GitHub Actions 실행·Branch protection 필수 체크 지정 모두 유료 플랜과 무관하다.

on:
  pull_request:
    branches: [develop]

jobs:
  develop-freshness:
    name: develop 최신화 확인
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR 브랜치가 develop과 오래 동기화되지 않았는지 확인
        env:
          # scripts/git-hooks/pre-push의 STALE_HOURS와 같은 기준을 쓴다. 값을 바꾸려면
          # 이 워크플로우와 pre-push의 STALE_HOURS를 함께 맞춘다(두 곳이 서로 다른 값을
          # 갖게 되면 로컬에서는 통과했는데 서버에서 막히는 혼란이 생긴다).
          STALE_HOURS: 24
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin develop --quiet

          ahead_on_develop="$(git rev-list --count "${HEAD_SHA}..origin/develop")"
          if [ "$ahead_on_develop" -eq 0 ]; then
            echo "develop과 동일하거나 앞서 있습니다 — 통과."
            exit 0
          fi

          merge_base="$(git merge-base "${HEAD_SHA}" origin/develop)"
          merge_base_time="$(git log -1 --format=%ct "$merge_base")"
          now="$(date +%s)"
          age_hours=$(( (now - merge_base_time) / 3600 ))

          echo "develop과 마지막으로 동기화된 지 ${age_hours}시간, 그 사이 develop에 커밋 ${ahead_on_develop}개 추가됨."

          if [ "$age_hours" -gt "$STALE_HOURS" ]; then
            echo "::error::이 브랜치는 develop과 마지막으로 동기화된 지 ${age_hours}시간(기준 ${STALE_HOURS}시간)이 지났고, 그 사이 develop에 커밋이 ${ahead_on_develop}개 더 쌓였습니다. 먼저 develop을 이 브랜치에 merge한 뒤 다시 push하세요: git fetch origin develop && git merge origin/develop"
            exit 1
          fi

          echo "기준 이내입니다 — 통과."
