<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>contracts-payments — 납품 관리 (low-fi)</title>
<style>
  body{ font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; background:#f1f1f1; margin:0; padding:2rem; color:#333; }
  .meta{ max-width:720px; margin:0 auto 1rem; font-size:12px; color:#888; }
  .frame{ max-width:720px; margin:0 auto; background:#fff; border:2px dashed #999; padding:1.5rem; display:grid; grid-template-columns:2fr 1fr; gap:1rem; }
  .box{ background:#e5e5e5; border:1px solid #aaa; border-radius:2px; padding:.75rem; margin-bottom:.75rem; color:#777; font-size:14px; }
  .box.button{ background:#ccc; border-color:#888; text-align:center; font-weight:bold; color:#555; }
  .label{ font-size:11px; color:#999; text-transform:uppercase; letter-spacing:.05em; margin-bottom:.25rem; }
  @media (max-width: 1000px) { .frame { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="meta">contracts-payments · DLV-01 · low-fi · 8:4 · 앱 셸 없음</div>
<div class="frame">
  <div>
    <div class="label">상태</div>
    <div class="box">프리랜서 납품 가능</div>
    <div class="label">[BUTTON] 핵심 액션</div>
    <div class="box button">결과물 납품</div>
  </div>
  <div>
    <div class="label">거래 진행</div>
    <div class="box">계약 · 결제 · 납품 · 승인 · 정산</div>
    <div class="label">프로젝트 / 상대방 / 유의사항</div>
    <div class="box">요약</div>
  </div>
</div>
</body>
</html>
