<title>PactFive 대표페이지</title>
<style>
/* ── _tokens.css ── */
/* PactFive 대표페이지 제안 — 공용 토큰
 *
 * 값의 정본은 `design-system/design-tokens.md` 의 TS 블록이다.
 * 이 파일은 그 값을 CSS 변수로 옮긴 사본이며, **원시 색상값은 여기에만 있다.**
 * 화면 파일(main·browse·detail)은 semantic 변수만 참조한다.
 *
 * 변환본(pactfive_reference_main.html)과 다른 점 — 그쪽은 teal 을 #007a80,
 * yellow 를 #ffd735 로 쓰고 하드코딩 색이 64종이었다. 정본과 어긋나 `npm run check:design`
 * 이 깨진다. 여기서는 정본 값으로 되돌렸다.
 */

:root {
  /* ── primitive · 여기서만 사용 ───────────────────────── */
  --navy-50:#F5F7FA;  --navy-100:#E9EDF3; --navy-200:#D5DCE7; --navy-300:#B7C0CF;
  --navy-400:#8995A8; --navy-500:#667085; --navy-600:#55627A; --navy-700:#394760;
  --navy-800:#1D2942; --navy-900:#111B33; --navy-950:#0B132B;

  --teal-50:#E7F5F4;  --teal-100:#C7E9E8; --teal-200:#8FD3D1; --teal-400:#1D9C9B;
  --teal-500:#008A8D; --teal-600:#007C7E; --teal-700:#006D70; --teal-900:#073F43;

  --rust-50:#FDEEEA;  --rust-500:#D95336; --rust-700:#B93824;
  --green-50:#EAF7F0; --green-200:#A7DFC5; --green-600:#16734D; --green-700:#115D3E;
  --amber-50:#FFF9E7; --amber-100:#FFF3C4; --amber-600:#9A6200; --amber-700:#7A4B00;
  --blue-50:#EDF5FC;  --blue-200:#B9D9F3; --blue-600:#1C5F9C;

  --campaign-yellow:#F4C430;
  --campaign-plum:#4B173C;
  --campaign-lavender:#E9DDFB;
  /* 대표페이지 히어로 바탕. campaign-yellow 를 옅게 깐 것이다.
   * amber 계열을 쓰지 않은 이유: 그쪽은 경고(--warning-surface)에 배정돼 있어
   * 같은 색이 두 가지 뜻을 갖게 된다. */
  --campaign-yellow-soft: #FDF3D6;
  --campaign-yellow-edge: #EFDFAA;
  --campaign-yellow-deep: #E8C765;
  /* ── 대표페이지 카테고리 아이콘 팔레트 ──────────────────────
   * `ux-philosophy/reference-main.html`(오민혁 시안) 의 아이콘 색을 그대로 옮긴 것이다.
   * 아이콘 10종이 저마다 다른 색을 쓰는데, 그 다색이 시안의 성격이라 살렸다.
   * **아이콘 안에서만 쓴다.** 다른 UI 로 새 나가면 §12 의 다색 금지에 걸린다.
   */
  --ico-ink:#17233A;
  --ico-blue:#2D71DB;  --ico-blue-soft:#7B9EDC;  --ico-blue-pale:#4DA3FF;
  --ico-navy:#263C5F;  --ico-navy-deep:#253348;
  --ico-yellow:#F5CB37; --ico-yellow-deep:#EFB819;
  --ico-mint:#5BC5B2;
  --ico-grey:#D8E0E8;  --ico-grey-pale:#EEF0F2;

  /* 별점. 노랑 계열이지만 캠페인 색도 경고 색도 아니다 — 역할이 달라 따로 둔다 */
  --rating-star:#F4A300;

  --white:#FFFFFF; --canvas:#FBFAF7; --surface-base:#F7F8FA; --muted:#EEF1F5;
  --border-base:#CBD3DF; --border-strong:#7A8498; --black:#090D18;

  /* ── semantic · 화면은 이것만 참조한다 ────────────────── */
  --bg:               var(--canvas);
  --surface:          var(--white);
  --surface-subtle:   var(--surface-base);
  --surface-selected: var(--teal-50);

  --content:           var(--navy-950);
  --content-secondary: var(--navy-600);
  --content-tertiary:  var(--navy-500);
  --content-inverse:   var(--white);

  --border:        var(--border-base);
  --border-subtle: var(--navy-100);
  --border-focus:  var(--teal-500);

  --action:          var(--teal-500);
  --action-hover:    var(--teal-600);
  --action-text:     var(--white);
  --action-quiet:    var(--teal-700);

  --success:  var(--green-700);  --success-surface: var(--green-50);
  --warning:  var(--amber-700);  --warning-surface: var(--amber-50);
  --danger:   var(--rust-700);   --danger-surface:  var(--rust-50);
  --info:     var(--blue-600);   --info-surface:    var(--blue-50);

  /* ── 형태 ────────────────────────────────────────────── */
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --btn-h:44px; --btn-h-sm:36px; --field-h:48px;

  /* 그림자는 두 단계뿐이다. 흰 카드를 띄우려는 과한 그림자는 금지 (§12) */
  --shadow-card:  0 1px 2px rgba(9,13,24,.04);
  --shadow-raise: 0 6px 20px rgba(9,13,24,.08);
  /* 세 번째 단계. **히어로 삽화 한 곳에만** 쓴다 — 목록 카드에는 쓰지 않는다.
   * 겹쳐 놓은 판을 눈으로 분리하려면 접지 그림자와 확산 그림자가 둘 다 필요하다.
   * §12 가 금지하는 것은 카드 격자에서 흰 카드를 띄우려고 그림자를 키우는 것이다. */
  --shadow-hero:  0 2px 4px rgba(9,13,24,.06), 0 18px 44px rgba(9,13,24,.13);

  /* 면의 위쪽 1px 을 밝게 해 두께를 만든다. 그림자와 달리 면적을 먹지 않는다 */
  --edge-top: inset 0 1px 0 rgba(255,255,255,.85);

  --gap-1:4px; --gap-2:8px; --gap-3:12px; --gap-4:16px;
  --gap-5:24px; --gap-6:32px; --gap-7:48px; --gap-8:72px;

  --page-max:1180px;
  /* 분기점 360 · 768 · 1024 · 1280 / gutter 16 · 24 · 32 */
  --gutter:32px;

  /* ── 모션 ─────────────────────────────────────────────
   * 외부 레퍼런스의 200~500ms 를 평균내지 않는다 — 목록 비교 화면에서
   * 느린 전환은 스캔을 방해한다. 조사 결론도 같았다
   * (`outputs/design-research/00-요약.md` §7).
   *
   * 출처였던 `design-system/reference-snapshot.html` 은 2026-09-02 팀 반려로
   * 삭제됐다(PR #43 · ADR-0012 폐기). 아래 값은 그 문서에서 옮겨온 것이며,
   * 지금은 이 파일이 유일한 기록이다. 팀이 모션 정본을 다시 정하면 그쪽을 따른다.
   */
  --dur-feedback:100ms;  --ease-feedback:cubic-bezier(.2,0,0,1);
  --dur-enter:160ms;     --ease-enter:cubic-bezier(0,0,0,1);
  --dur-exit:160ms;      --ease-exit:cubic-bezier(.3,0,1,1);
  --dur-overlay:240ms;
  --stagger:40ms;
}

@media (max-width:1023px) { :root { --gutter:24px; } }
@media (max-width:767px)  { :root { --gutter:16px; } }

/* ── 기본 ─────────────────────────────────────────────── */

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--content);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* 금액·날짜는 자릿수가 맞아야 비교가 된다 (§5) */
.num { font-variant-numeric:tabular-nums; letter-spacing:-.01em; }

a { color:inherit; text-decoration:none; }

:focus-visible {
  outline:2px solid var(--border-focus);
  outline-offset:2px;
  border-radius:var(--r-sm);
}

.page { max-width:var(--page-max); margin:0 auto; padding:0 var(--gutter); }

/* ── 타이포 ───────────────────────────────────────────── */

.display { font-size:clamp(32px,4.2vw,52px); line-height:1.18; font-weight:800;
  letter-spacing:-.03em; margin:0; }
.h1 { font-size:28px; line-height:1.3; font-weight:700; letter-spacing:-.02em; margin:0; }
.h2 { font-size:20px; line-height:1.4; font-weight:700; letter-spacing:-.01em; margin:0; }
.h3 { font-size:16px; line-height:1.5; font-weight:600; margin:0; }
.body-sec { color:var(--content-secondary); }
.caption { font-size:13px; line-height:1.5; color:var(--content-tertiary); }

/* ── 버튼 ─────────────────────────────────────────────── */

.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:var(--gap-2);
  height:var(--btn-h); padding:0 var(--gap-5);
  border:1px solid transparent; border-radius:var(--r-md);
  font:inherit; font-weight:600; cursor:pointer;
  transition:background .15s ease, border-color .15s ease, color .15s ease;
}
.btn.sm { height:var(--btn-h-sm); padding:0 var(--gap-3); font-size:14px; }
.btn.primary   { background:var(--action); color:var(--action-text); }
.btn.primary:hover { background:var(--action-hover); }
.btn.secondary { background:var(--surface); color:var(--action-quiet); border-color:var(--action); }
.btn.secondary:hover { background:var(--surface-selected); }
.btn.quiet     { background:transparent; color:var(--content-secondary); }
.btn.quiet:hover { background:var(--muted); }
.btn[disabled] { background:var(--muted); color:var(--navy-400); border-color:transparent;
  cursor:not-allowed; }

/* ── 배지 · 칩 ────────────────────────────────────────── */

.badge {
  display:inline-flex; align-items:center; height:24px; padding:0 var(--gap-2);
  border-radius:var(--r-sm); font-size:12px; font-weight:700; white-space:nowrap;
}
.badge.open      { background:var(--success-surface); color:var(--success); }
.badge.scheduled { background:var(--info-surface);    color:var(--info); }
.badge.closed    { background:var(--muted);           color:var(--content-tertiary); }
.badge.pending   { background:var(--warning-surface); color:var(--warning); }

.chip {
  display:inline-flex; align-items:center; height:26px; padding:0 var(--gap-3);
  border:1px solid var(--border-subtle); border-radius:var(--r-pill);
  background:var(--surface); font-size:12px; color:var(--content-secondary);
}

/* ── 카드 ─────────────────────────────────────────────── */

.card {
  background:var(--surface); border:1px solid var(--border-subtle);
  border-radius:var(--r-lg); box-shadow:var(--shadow-card);
}

/* ── 프로젝트 카드 ─────────────────────────────────────
 *
 * main.html 과 browse.html 이 **같은 것을 쓴다.** 두 벌로 두면 한쪽만 고쳐진다.
 *
 * 정보 그룹 9개를 늘 같은 순서로 둔다. 순서가 카드마다 다르면 눈으로 비교할 수 없다.
 *
 *   1 카테고리   2 모집 상태   3 제목   4 의뢰인   5 의뢰인 평점
 *   6 예산       7 요구 기술   8 지원자 수   9 마감(절대+상대)
 *
 * 전부 `PublicProjectItem` 에 실제로 있는 값이다. 근무 방식·예상 기간은
 * `projects` 에 없어서 넣지 않았다 (아래 README 참고).
 */

.pcard {
  display:flex; flex-direction:column; gap:var(--gap-2);
  padding:var(--gap-5);
  background:var(--surface); border:1px solid var(--border-subtle);
  border-radius:var(--r-lg);
  /* 기본은 테두리로 구분하고 그림자는 hover 에만. 레퍼런스 5곳 중 3곳이 그림자를 안 쓴다 */
  transition:border-color var(--dur-feedback) var(--ease-feedback),
             box-shadow var(--dur-feedback) var(--ease-feedback);
}
.pcard:hover { border-color:var(--border-focus); box-shadow:var(--shadow-raise); }

/* 1·2 — 카테고리와 상태를 한 줄에. 북마크는 우측 끝 */
.pcard__head { display:flex; align-items:center; gap:var(--gap-2); }
.pcard__cat { font-size:12px; font-weight:600; color:var(--content-tertiary); }
.pcard__head .save { margin-left:auto; }

/* 3 */
.pcard__title { font-size:16px; font-weight:600; line-height:1.45; margin:2px 0 0;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

/* 4·5 — 의뢰인과 평판을 한 줄로 묶는다 */
.pcard__client { display:flex; align-items:center; gap:var(--gap-2);
  font-size:12px; color:var(--content-tertiary); }
.pcard__client b { font-weight:600; color:var(--content-secondary); }
.pcard__rate { color:var(--content-tertiary); }

/* 6 */
.pcard__budget { font-size:22px; font-weight:800; letter-spacing:-.02em; margin:var(--gap-1) 0 0; }

/* 7 */
.pcard__skills { display:flex; flex-wrap:wrap; gap:var(--gap-1); }
.pcard__more { font-size:12px; color:var(--content-tertiary); align-self:center; }

/* 8·9 — 2열 메타 행. 세로로 쌓으면 정보 하나당 높이가 그대로 늘어난다 */
.pcard__meta { display:grid; grid-template-columns:1fr auto; gap:var(--gap-2);
  align-items:baseline; margin-top:auto; padding-top:var(--gap-3);
  border-top:1px solid var(--border-subtle); font-size:12px;
  color:var(--content-tertiary); }
.pcard__meta .due { text-align:right; }
.pcard__meta .due b { color:var(--content-secondary); font-weight:700; }

.pcard--dim { background:var(--surface-subtle); }

.save { width:30px; height:30px; flex:none; border-radius:var(--r-sm);
  border:1px solid var(--border-subtle); background:var(--surface);
  color:var(--content-tertiary); cursor:pointer; font-size:14px; line-height:1;
  transition:border-color var(--dur-feedback) var(--ease-feedback),
             color var(--dur-feedback) var(--ease-feedback); }
.save:hover { border-color:var(--action); color:var(--action); }
.save[aria-pressed="true"] { border-color:var(--action); color:var(--action);
  background:var(--surface-selected); }

/* 목록 등장 — 첫 8개만 stagger, 9번째부터 즉시 (정본 계약) */
@keyframes pf-enter { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
.enter > * { animation:pf-enter var(--dur-enter) var(--ease-enter) both; }
.enter > :nth-child(1) { animation-delay:0ms; }
.enter > :nth-child(2) { animation-delay:40ms; }
.enter > :nth-child(3) { animation-delay:80ms; }
.enter > :nth-child(4) { animation-delay:120ms; }
.enter > :nth-child(5) { animation-delay:160ms; }
.enter > :nth-child(6) { animation-delay:200ms; }
.enter > :nth-child(7) { animation-delay:240ms; }
.enter > :nth-child(8) { animation-delay:280ms; }
.enter > :nth-child(n+9) { animation:none; }

@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after { animation-duration:0ms !important; animation-delay:0ms !important;
    transition-duration:0ms !important; }
}

/* ── 앱 셸 ────────────────────────────────────────────── */

.appbar {
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:saturate(1.2) blur(8px);
  border-bottom:1px solid var(--border-subtle);
}
.appbar__in { display:flex; align-items:center; gap:var(--gap-6);
  height:64px; max-width:var(--page-max); margin:0 auto; padding:0 var(--gutter); }
.logo { font-size:20px; font-weight:800; letter-spacing:-.03em; white-space:nowrap; }
.logo em { font-style:normal; color:var(--action); }
.appbar nav { display:flex; gap:var(--gap-5); font-size:14px; font-weight:500;
  color:var(--content-secondary); white-space:nowrap; }
.appbar nav a { transition:color var(--dur-feedback) var(--ease-feedback); }
.appbar nav a:hover { color:var(--content); }
.appbar .spacer { margin-left:auto; }

/* 모바일 — 로고와 주요 행동만 한 줄에 두고 nav 는 아래 줄에서 가로로 넘긴다.
   한 줄에 다 넣으면 nav 글자가 세로로 접힌다. */
@media (max-width:767px) {
  .appbar__in { flex-wrap:wrap; height:auto; align-items:center;
    padding-top:var(--gap-2); padding-bottom:var(--gap-2); gap:var(--gap-3) var(--gap-4); }
  .appbar__in > .spacer { order:1; }
  .appbar__in > .btn, .appbar__in > .logo { order:0; }
  .appbar nav { order:2; width:100%; gap:var(--gap-4);
    overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
  .appbar nav::-webkit-scrollbar { display:none; }
}

/* ── 아직 없는 화면 안내 ─────────────────────────────────────
 * `href="#"` 로 두면 눌러도 아무 일이 없어 고장으로 읽힌다.
 * 없다는 것과 누가 만드는지를 말한다 (demo/notyet.js).
 */
.notyet { position:fixed; inset:0; z-index:100; display:grid; place-items:center;
  padding:var(--gutter); }
.notyet__scrim { position:absolute; inset:0; background:rgba(9,13,24,.45); }
.notyet__box { position:relative; max-width:460px; width:100%;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-lg); padding:var(--gap-5);
  box-shadow:var(--shadow-hero); }
.notyet__box h2 { margin:0 0 var(--gap-3); font-size:19px; letter-spacing:-.02em; }
.notyet__box p { margin:0 0 var(--gap-4); font-size:14px; line-height:1.7;
  color:var(--content-secondary); }
.notyet__kv { display:grid; grid-template-columns:auto 1fr; gap:6px var(--gap-4);
  margin:0 0 var(--gap-5); font-size:13px; }
.notyet__kv dt { color:var(--content-tertiary); font-weight:700; white-space:nowrap; }
.notyet__kv dd { margin:0; color:var(--content-secondary); word-break:break-all; }
.notyet__box .btn { width:100%; }

/* 시연용 계정 고르기. 진짜 로그인(오민혁)이 붙으면 통째로 사라진다 */
.picker { display:grid; gap:6px; margin:0 0 var(--gap-4); }
.picker__why { margin:0 0 var(--gap-3); font-size:12.5px; line-height:1.6;
  color:var(--content-tertiary); }
.picker__row { display:grid; grid-template-columns:auto auto 1fr; gap:var(--gap-2) var(--gap-3);
  align-items:baseline; text-align:left; width:100%;
  padding:var(--gap-3); border:1px solid var(--border-subtle);
  border-radius:var(--r-md); background:var(--surface); font:inherit; cursor:pointer;
  transition:border-color var(--dur-feedback) var(--ease-feedback),
             background var(--dur-feedback) var(--ease-feedback); }
.picker__row:hover { border-color:var(--action); background:var(--surface-selected); }
.picker__name { font-size:14px; font-weight:700; }
.picker__role { font-size:11px; font-weight:700; color:var(--action-quiet);
  background:var(--surface-selected); border-radius:var(--r-pill); padding:2px 8px; }

      rows = rows.filter(function (p) { return effectiveStatus(p, now) !== "CLOSED"; });
    }

    // engagement 규칙 13 — 내 북마크는 **마감돼도 남는다.** 공개 목록과 반대다.

   * (engagement 규칙 28 과 같은 이유).
   */
  function list(query) {
    var q = query || {};
    var rows = EXPERTS.slice();

    if (q.category) rows = rows.filter(function (x) { return x.category === q.category; });
    if (q.skills && q.skills.length) {
      rows = rows.filter(function (x) {
        return q.skills.every(function (s) { return x.skills.indexOf(s) !== -1; });
      });
    }

    var by = q.sortBy || "rating";
    rows.sort(function (a, b) {
      if (by === "reviews") {
        if (a.reviews !== b.reviews) return b.reviews - a.reviews;
      } else if (by === "years") {
        if (a.years !== b.years) return b.years - a.years;
      } else {
        // 평점순. 평가가 없는 사람은 뒤로 보내되 **0점으로 취급하지 않는다** —
        // "나쁘다"와 "아직 없다"는 다르다
        var ar = a.reviews > 0 ? a.rating : -1;
        var br = b.reviews > 0 ? b.rating : -1;
        if (ar !== br) return br - ar;
      }
      return a.id < b.id ? -1 : 1;
    });

    var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    var page = Math.min(Math.max(1, q.page || 1), totalPages);

      /* 무시 — 위와 같은 이유 */
    }
  }

  function has(id) {
    return ids.indexOf(id) !== -1;
  }

  /** 규칙 1·2 — 결과 상태를 만든다. 몇 번을 눌러도 결과가 같다 */
  function set(id, on) {
    var at = ids.indexOf(id);
    if (on && at === -1) ids.push(id);
    if (!on && at !== -1) ids.splice(at, 1);
    save();
    return has(id);
  }

  function toggle(id) {
    return set(id, !has(id));
  }

  function count() {
    return ids.length;
  }

  /** 버튼 하나의 겉모습을 상태에 맞춘다. 아이콘·읽어 주는 이름·누름 상태를 함께 바꾼다 */
  function paint(btn, on) {
    btn.textContent = on ? "★" : "☆";
    btn.setAttribute("aria-pressed", on ? "true" : "false");

   * 화면 전체에 위임으로 한 번만 건다. 카드를 다시 그려도 다시 걸 필요가 없다.

   */
  var bound = false;
  function bind() {
    if (bound) return; // 화면을 바꿀 때마다 불린다. 두 번 걸면 한 번 눌러 두 번 토글된다
    bound = true;
    document.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-bookmark]");
      if (!btn) return;
      e.preventDefault();
      var id = btn.getAttribute("data-bookmark");
      var on = toggle(id);
      document.querySelectorAll('[data-bookmark="' + id + '"]').forEach(function (b) {
        paint(b, on);
      });
      document.dispatchEvent(new CustomEvent("pactfive:bookmark", { detail: { id: id, on: on } }));
    });

    has: has,
    set: set,
    toggle: toggle,
    count: count,
    paint: paint,
    bind: bind,
  };

/**
 * 누가 보고 있는가.
 *
 * **로그인 화면은 여기서 만들지 않는다.** user-management(오민혁) 담당이다.
 * 이 파일은 그 자리에 끼울 **연결점**만 정한다 — 화면들이 "지금 누가 보는가"를
 * 물어볼 창구 하나. 실제 로그인이 붙으면 `signIn()` 안쪽만 바뀌고
 * 화면 코드는 그대로다.
 *
 * 역할에 따라 화면이 달라지는 규칙이 여럿이라 역할 전환은 필요하다.
 *   engagement 규칙 30 — 북마크 아이콘은 비로그인·프리랜서·의뢰인이 각각 다르다
 *   project-management 규칙 17 — 내 프로젝트는 등록 의뢰인만
 *
 * 계정은 PRD §9 의 시드 6개를 그대로 쓴다. 지어내지 않는다.
 */
(function (global) {
  "use strict";

  var KEY = "pactfive:demo:session";

  /** PRD §9.2 시드 계정 6개 */
  var ACCOUNTS = [
    { id: "client-a", name: "김서연", role: "CLIENT", org: "주식회사 마루컴퍼니", note: "시연 주인공. 등록 → 수락 → 계약" },
    { id: "client-b", name: "박정우", role: "CLIENT", org: "라온물류", note: "다른 의뢰인의 프로젝트" },
    { id: "client-c", name: "이하늘", role: "CLIENT", org: "", note: "프로필 미완성 — 등록 게이트 시연용" },
    { id: "freelancer-a", name: "김다은", role: "FREELANCER", org: "Product designer", note: "시연 주인공. 지원 → 수락됨" },
    { id: "freelancer-b", name: "박서윤", role: "FREELANCER", org: "Frontend developer", note: "자동 거절 대상" },
    { id: "freelancer-c", name: "이준호", role: "FREELANCER", org: "Brand designer", note: "북마크·추천 시연" },
  ];

  function load() {
    try {
      var raw = global.sessionStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null; // 저장소가 막혀도 화면은 비로그인으로 돌아간다
    }
  }

  var current = load();

  function save() {
    try {
      if (current) global.sessionStorage.setItem(KEY, JSON.stringify(current));
      else global.sessionStorage.removeItem(KEY);
    } catch (e) {
      /* 무시 */
    }
  }

  /** 실제 로그인이 붙을 자리. 지금은 시드 계정을 그대로 세운다 */
  function signIn(accountId) {
    current = ACCOUNTS.filter(function (a) { return a.id === accountId; })[0] || null;
    save();
    notify();
    return current;
  }

  function signOut() {
    current = null;
    save();
    notify();
  }

  function user() { return current; }
  function isFreelancer() { return !!current && current.role === "FREELANCER"; }
  function isClient() { return !!current && current.role === "CLIENT"; }

  function notify() {
    document.dispatchEvent(new CustomEvent("pactfive:session", { detail: current }));
  }

  /**
   * 헤더의 오른쪽을 상태에 맞춘다.
   *
   * 비로그인 — 로그인 · 프로젝트 등록
   * 로그인   — 이름(마이페이지로) · 로그아웃 · 프로젝트 등록
   *
   * **북마크는 헤더에 두지 않는다.** 로그인해야 의미가 있는 것이라
   * 마이페이지 안으로 넣었다.
   */
  function paintHeader(root) {
    var slot = (root || document).querySelector("[data-session-actions]");
    if (!slot) return;
    var u = current;
    slot.innerHTML = u
      ? '<a class="login" href="#/mypage">' + u.name + " 님</a>" +
        '<button class="btn quiet sm" type="button" data-signout>로그아웃</button>' +
        '<a class="btn primary sm" href="#/register">프로젝트 등록</a>'
      : '<a class="login" href="#" data-notyet="login">로그인</a>' +
        '<a class="btn primary sm" href="#/register">프로젝트 등록</a>';
  }

  var bound = false;
  function bind() {
    if (bound) return;
    bound = true;
    document.addEventListener("click", function (e) {
      if (e.target.closest("[data-signout]")) {
        e.preventDefault();
        signOut();
      }
      var pick = e.target.closest("[data-signin]");
      if (pick) {
        e.preventDefault();
        signIn(pick.getAttribute("data-signin"));
      }
    });
  }

  /** 로그인 안내 안에 붙는 시연용 계정 목록. 진짜 로그인이 생기면 통째로 사라진다 */
  function accountPickerHTML() {
    return (
      '<div class="picker">' +
        '<p class="picker__why">로그인 화면은 <b>오민혁 (user-management)</b> 담당입니다. ' +
        "여기서는 역할에 따라 화면이 어떻게 달라지는지만 보이도록 시드 계정을 그대로 세웁니다.</p>" +
        ACCOUNTS.map(function (a) {
          return '<button class="picker__row" type="button" data-signin="' + a.id + '">' +
            '<span class="picker__name">' + a.name + "</span>" +
            '<span class="picker__role">' + (a.role === "CLIENT" ? "의뢰인" : "프리랜서") + "</span>" +
            '<span class="picker__note">' + a.note + "</span>" +
          "</button>";
        }).join("") +
      "</div>"
    );
  }

  global.PactFiveSession = {
    ACCOUNTS: ACCOUNTS,
    signIn: signIn,
    signOut: signOut,
    user: user,
    isFreelancer: isFreelancer,
    isClient: isClient,
    paintHeader: paintHeader,
    accountPickerHTML: accountPickerHTML,
    bind: bind,
  };
})(window);

/**
 * 프로젝트 등록 3단계 (SCR-B03 · B04 · B05).
 *
 * 문구는 `design/high-fi-register.html` 의 「필수 요소 목록」이 정본이다.
 * `prototype/run.tsx` 가 그 목록을 기계적으로 확인하므로 여기서 말을 바꾸면
 * 화면과 테스트가 갈라진다.
 *
 * **입력한 것을 잃지 않는다** (ux-philosophy §6 작업 보호).
 * 단계를 오가도, 새로고침해도, 실수로 닫았다 다시 열어도 남는다.
 * `sessionStorage` 를 쓴다 — `localStorage` 는 공용 PC 에서 남의 초안이 보인다.
 */
(function (global) {
  "use strict";

  var D = global.PactFiveData;
  var E = global.PactFiveEngine;
  var KEY = "pactfive:demo:draft";
  var VERSION = 1;

  /* ═══════════ 초안 ═══════════ */

  function empty() {
    return { title: "", description: "", category: "", startAt: "", deadlineAt: "",
      budget: "", skills: [], budgetSource: "" };
  }

  function load() {
    try {
      var raw = global.sessionStorage.getItem(KEY);
      if (!raw) return { value: empty(), restored: false };
      var box = JSON.parse(raw);
      // 형식이 바뀌었으면 버린다. 반쯤 맞는 값으로 화면을 채우는 것이 더 위험하다
      if (box.version !== VERSION) { global.sessionStorage.removeItem(KEY); return { value: empty(), restored: false }; }
      return { value: box.value, restored: true };
    } catch (e) {
      return { value: empty(), restored: false };
    }
  }

  var boot = load();
  var draft = boot.value;
  var restored = boot.restored;
  var savedAt = null;

  function save() {
    try {
      savedAt = new Date();
      global.sessionStorage.setItem(KEY, JSON.stringify({ version: VERSION, value: draft }));
    } catch (e) {
      /* 저장만 못 할 뿐 화면은 그대로 돌아야 한다 */
    }
  }

  function clear() {
    try { global.sessionStorage.removeItem(KEY); } catch (e) { /* 무시 */ }
    draft = empty();
    restored = false;
    savedAt = null;
  }

  /* ═══════════ 검증 ═══════════
     문구는 spec.md 규칙과 맞춘다. 무엇이 틀렸는지와 **어떻게 고치는지**를 함께 말한다 */

  var DAY = 24 * 60 * 60 * 1000;

  function errors(step) {
    var e = {};
    if (step === 1) {
      var t = draft.title.trim();
      if (!t) e.title = "제목을 입력해 주세요.";
      else if (t.length < 5) e.title = "5자 이상 입력해 주세요. 지금 " + t.length + "자입니다.";
      else if (t.length > 100) e.title = "100자 이하로 줄여 주세요. 지금 " + t.length + "자입니다.";

      var d = draft.description.trim();
      if (!d) e.description = "설명을 입력해 주세요.";
      else if (d.length < 20) e.description = "20자 이상 적어 주세요. 지금 " + d.length + "자입니다.";

      if (!draft.category) e.category = "카테고리를 골라 주세요.";
    }
    if (step === 2) {
      if (!draft.deadlineAt) e.deadlineAt = "모집 마감일을 정해 주세요.";
      else {
        var end = new Date(draft.deadlineAt).getTime();
        var base = draft.startAt ? new Date(draft.startAt).getTime() : Date.now();
        if (end <= Date.now()) e.deadlineAt = "마감일은 오늘보다 뒤여야 합니다.";
        else if (end - base > 365 * DAY) e.deadlineAt = "모집 기간은 최대 1년까지입니다.";
        else if (draft.startAt && end <= base) e.deadlineAt = "마감일이 시작일보다 앞섭니다.";
      }
      var b = Number(String(draft.budget).replace(/[^0-9]/g, ""));
      if (!b) e.budget = "예산을 입력해 주세요.";
      else if (b < 100000) e.budget = "최소 100,000원 이상으로 입력해 주세요.";
    }
    if (step === 3) {
      if (draft.skills.length === 0) e.skills = "기술을 최소 1개 골라 주세요.";
      else if (draft.skills.length > 10) e.skills = "최대 10개까지입니다.";
    }
    return e;
  }

  function stepOf() {
    var n = Number(new URLSearchParams((global.__pactfiveQuery || location.hash.slice(1)) || "").get("step"));
    return n >= 1 && n <= 3 ? n : 1;
  }

  function goto(n) { location.hash = "step=" + n; }

  /* ═══════════ 그리기 ═══════════ */

  var shown = {}; // 아직 건드리지 않은 칸에 빨간 글씨를 미리 띄우지 않는다

  function field(name, label, inner, help) {
    var msg = shown[name] ? (errors(stepOf())[name] || "") : "";
    return '<div class="field" data-invalid="' + (msg ? "true" : "false") + '">' +
      "<label" + (name ? ' for="f-' + name + '"' : "") + ">" + label + "</label>" +
      inner +
      (msg ? '<p class="err" role="alert">' + msg + "</p>"
           : help ? '<p class="help">' + help + "</p>" : "") +
    "</div>";
  }

  function step1() {
    return '<h2>프로젝트를 등록합니다</h2>' +
      field("title", "프로젝트 제목",
        '<input id="f-title" name="title" type="text" value="' + E.esc(draft.title) +
        '" placeholder="예) 쇼핑몰 웹사이트 구축" maxlength="120" />',
        "5자 이상 100자 이하로 입력해 주세요.") +
      field("description", "프로젝트 설명",
        '<textarea id="f-description" name="description" ' +
        'placeholder="어떤 작업이 필요한지 구체적으로 적어 주세요.">' + E.esc(draft.description) + "</textarea>",
        "20자 이상 적어 주시면 AI 단가 분석을 더 정확하게 받을 수 있습니다.") +
      field("category", "카테고리",
        '<select id="f-category" name="category"><option value="">고르세요</option>' +
        D.CATEGORIES.map(function (c) {
          return '<option value="' + c.id + '"' + (draft.category === c.id ? " selected" : "") + ">" + c.name + "</option>";
        }).join("") + "</select>");
  }

  function step2() {
    var b = Number(String(draft.budget).replace(/[^0-9]/g, ""));
    return '<h2>일정과 예산을 정합니다</h2>' +
      '<div class="two">' +
        field("startAt", "모집 시작일 (선택)",
          '<input id="f-startAt" name="startAt" type="date" value="' + E.esc(draft.startAt) + '" />',
          "비워두면 바로 모집을 시작합니다") +
        field("deadlineAt", "모집 마감일",
          '<input id="f-deadlineAt" name="deadlineAt" type="date" value="' + E.esc(draft.deadlineAt) + '" />',
          "모집 기간은 7일 이상을 권장합니다. 최대 1년까지 설정할 수 있습니다.") +
      "</div>" +
      field("budget", "예산",
        '<input id="f-budget" name="budget" type="text" inputmode="numeric" value="' +
        (b ? b.toLocaleString("ko-KR") : "") + '" placeholder="예) 5,000,000" />',
        "단위는 원입니다. 나중에 지원자가 생기면 변경할 수 없습니다.") +

      // 조건부 영역이라 「필수 요소 목록」에서 제외된 자리다
      '<div class="ai">' +
        "<b>AI 단가 분석</b>" +
        "<p>설명을 20자 이상 적으면 비슷한 프로젝트를 근거로 예산 범위를 알려드립니다." +
        (draft.description.trim().length >= 20
          ? " 지금 분석할 수 있습니다."
          : " 지금은 설명이 " + draft.description.trim().length + "자입니다.") + "</p>" +
        (draft.budgetSource === "AI_ANALYSIS"
          // 예산이 어디서 왔는지 화면에 남긴다 (CR-0006 결함 2)
          ? '<p class="help">현재 예산은 <b>AI 단가 분석이 제안한 금액</b>입니다. ' +

            (draft.description.trim().length >= 20 ? "" : " disabled") + ">예산 범위 받아보기</button>") +
      "</div>";
  }

  function step3() {
    var cat = D.CATEGORIES.filter(function (c) { return c.id === draft.category; })[0];
    var b = Number(String(draft.budget).replace(/[^0-9]/g, ""));
    var row = function (k, v, step) {
      return '<div class="review__row"><span class="review__k">' + k + "</span>" +

        '<a class="review__edit" href="#step=' + step + '">수정</a></div>';
    };

    return '<h2>입력한 내용을 확인해 주세요</h2>' +
      field("skills", '필요한 기술 <span class="caption num">' + draft.skills.length + " / 10</span>",
        '<div class="skills">' + D.SKILLS.map(function (s) {
          return "<label><input type=\"checkbox\" name=\"skill\" value=\"" + s.id + '"' +
            (draft.skills.indexOf(s.id) !== -1 ? " checked" : "") + " /> " + s.name + "</label>";
        }).join("") + "</div>",
        "최소 1개, 최대 10개까지 선택할 수 있습니다.") +

      '<div class="review">' +
        row("제목", E.esc(draft.title) || "—", 1) +
        row("설명", E.esc(draft.description.slice(0, 80)) + (draft.description.length > 80 ? "…" : "") || "—", 1) +
        row("카테고리", cat ? cat.name : "—", 1) +
        row("모집 기간", (draft.startAt || "즉시 시작") + " — " + (draft.deadlineAt || "—"), 2) +
        row("예산", b ? E.won(b) : "—", 2) +
        row("필요한 기술", draft.skills.length
          ? draft.skills.map(function (s) { return '<span class="chip">' + D.skillName(s) + "</span>"; }).join("")
          : "—", 3) +
      "</div>";
  }

  function render() {
    var root = document.getElementById("reg");
    if (!root) return;
    var step = stepOf();
    var body = step === 1 ? step1() : step === 2 ? step2() : step3();

    root.innerHTML =
      '<ul class="steps" style="list-style:none;padding:0;margin:0 0 var(--gap-5)">' +
        [1, 2, 3].map(function (n) {

        '<div class="acts">' +
          (step > 1 ? '<button class="btn quiet" type="button" data-go="' + (step - 1) + '">이전</button>' : "") +

      "</form>" +

      // 작업 보호를 화면에 말한다. 말하지 않으면 사용자는 사라질까 봐 못 떠난다
      '<p class="saved">' +
        (restored ? "이전에 입력하던 내용을 불러왔습니다. " : "") +

        (savedAt ? " — 마지막 저장 " + savedAt.toTimeString().slice(0, 5) : "") + "." +
        (draft.title || draft.description
          ? ' <button class="btn quiet sm" type="button" id="discard">입력한 내용 지우기</button>' : "") +

    /* 의뢰인 — 등록한 것 중 가장 급한 하나 */
    if (u.role === "CLIENT") {
      var mine = global.PactFiveManage ? global.PactFiveManage.mine() : [];
      var open = mine.filter(function (p) { return E.effectiveStatus(p) !== "CLOSED"; });
      if (open.length === 0) {
        slot.innerHTML = shell(true,
          icon() +
          '<span class="resume__main">' +
            '<span class="resume__k">내 프로젝트</span>' +
            '<span class="resume__title">진행 중인 프로젝트가 없습니다. 등록하면 여기서 한눈에 봅니다.</span>' +
          "</span>" +
          '<a class="btn secondary sm" href="#/register">프로젝트 등록</a>');
        return;
      }
      // 마감이 가장 가까운 것. 급한 것이 먼저 보여야 한다
      open.sort(function (a, b) { return new Date(a.deadlineAt) - new Date(b.deadlineAt); });
      var p = open[0];
      var dl = E.deadlineText(p.deadlineAt);
      // 지원이 들어왔으면 합의 단계로 본다. 실제 단계는 조준영 쪽 데이터다
      var at = p.applicationCount > 0 ? 1 : 0;

      slot.innerHTML = shell(false,
        icon() +
        '<span class="resume__main">' +
          '<span class="resume__k">내 프로젝트</span>' +
          '<span class="resume__title">' + E.esc(p.title) + "</span>" +
        "</span>" +
        steps(at) +
        '<span class="resume__due"><span>마감일</span><b class="num">' + dl.rel + "</b></span>" +
        '<a class="resume__go" href="#/mypage?tab=projects">전체 보기 ›</a>');
      return;
    }

    /* 프리랜서 — 저장해 둔 것 */
    var saved = E.list({ savedOnly: true, includeClosed: true, sortBy: "deadline" });
    if (saved.totalCount === 0) {
      slot.innerHTML = shell(true,
        icon() +
        '<span class="resume__main">' +
          '<span class="resume__k">저장한 프로젝트</span>' +
          '<span class="resume__title">카드의 별을 누르면 여기 모입니다.</span>' +
        "</span>" +
        '<a class="btn secondary sm" href="#/projects">프로젝트 둘러보기</a>');
      return;
    }
    var q = saved.items[0];
    var qd = E.deadlineText(q.deadlineAt);
    slot.innerHTML = shell(false,
      icon() +
      '<span class="resume__main">' +
        '<span class="resume__k">저장한 프로젝트 ' + saved.totalCount + "건 · 마감이 가장 가까운 것</span>" +
        '<span class="resume__title">' + E.esc(q.title) + "</span>" +
      "</span>" +
      '<span class="resume__due"><span>마감일</span><b class="num">' + qd.rel + "</b></span>" +
      '<a class="resume__go" href="#/mypage?tab=saved">전체 보기 ›</a>');
  }

  var bound = false;
  function bind() {
    if (bound) return;
    bound = true;
    // 로그인·북마크가 바뀌면 이 카드도 따라간다. 안 그러면 옛 상태가 남는다
    document.addEventListener("pactfive:session", render);
    document.addEventListener("pactfive:bookmark", render);
  }

  global.PactFiveResume = { render: render, bind: bind };
})(window);

/* ── demo/notyet.js ── */
/**
 * 아직 없는 화면을 누르면 무엇을 알려줄 것인가.
 *
 * 링크를 `href="#"` 로 두면 눌러도 아무 일이 없다. 사용자는 고장으로 읽는다.
 * **없다는 것을 말하고, 누가 만들며 명세가 어디 있는지까지 준다.**
 * 시안을 보는 사람이 곧 그 화면을 만들 사람이기 때문이다.
 *
 * `data-notyet="키"` 를 붙이면 이 파일이 알아서 처리한다.
 */
(function (global) {
  "use strict";

  var SCREENS = {
    login: {
      name: "로그인",
      owner: "오민혁 (user-management)",
      where: "features/user-management/",
      note: "",
      // 역할에 따라 화면이 달라지는 규칙이 여럿이라, 그것만 보이도록 계정을 세워 준다
      extra: function () {
        return window.PactFiveSession ? window.PactFiveSession.accountPickerHTML() : "";
      },
    },
    experts: {
      name: "전문가 찾기",
      owner: "정해지지 않음",
      where: "README.md 「확인이 필요한 것」 1번",
      note: "PRD 화면 목록(§7.1)에 프리랜서 탐색이 없다. 만들지 말지부터 정해야 한다.",
    },
    myproject: {
      name: "내 프로젝트",
      owner: "유동우 (project-management)",
      where: "design/high-fi-manage.html · SCR-B07",
      note: "진행 단계·납품 파일은 계약 이후 데이터라 조준영 쪽과 맞춰야 한다.",
    },
    apply: {
      name: "지원하기",
      owner: "최윤석 몫이었으나 팀장·조준영이 나눠 맡기로 함 (2026-09-02)",
      where: "features/applications/",
      note: "이 흐름의 시작점이다. 없으면 계약·결제까지 시연이 이어지지 않는다.",
    },
  };

  function close() {
    var d = document.getElementById("notyet");
    if (d) d.remove();
    if (global.__notyetReturn && global.__notyetReturn.focus) global.__notyetReturn.focus();
  }

  function open(key) {
    var s = SCREENS[key];
    if (!s) return;
    close();
    global.__notyetReturn = document.activeElement;

    var el = document.createElement("div");
    el.id = "notyet";
    el.className = "notyet";
    el.innerHTML =
      '<div class="notyet__scrim" data-close></div>' +
      '<div class="notyet__box" role="alertdialog" aria-modal="true"' +
        ' aria-labelledby="notyet-t" aria-describedby="notyet-d">' +
        '<h2 id="notyet-t">' + s.name + " 화면은 아직 없습니다</h2>" +
        '<div id="notyet-d">' +
          (s.note ? "<p>" + s.note + "</p>" : "") +
          (s.extra ? s.extra() : "") +
          '<dl class="notyet__kv">' +
            "<dt>담당</dt><dd>" + s.owner + "</dd>" +
            "<dt>명세</dt><dd><code>" + s.where + "</code></dd>" +
          "</dl>" +
        "</div>" +
        '<button class="btn primary" type="button" data-close>닫기</button>' +
      "</div>";
    document.body.appendChild(el);

    el.querySelectorAll("[data-close]").forEach(function (b) {
      b.addEventListener("click", close);
    });
    // Esc 로 닫힌다. 빠져나갈 길을 하나만 두지 않는다
    el.addEventListener("keydown", function (e) {
      if (e.key === "Escape") close();
    });
    el.querySelector(".btn").focus();
  }

  var bound = false;
  function bind() {
    if (bound) return; // 위와 같은 이유
    bound = true;
    document.addEventListener("click", function (e) {
      if (e.target.closest("[data-signin]")) { close(); return; }
      var t = e.target.closest("[data-notyet]");
      if (!t) return;
      e.preventDefault();
      open(t.getAttribute("data-notyet"));
    });
  }

  global.PactFiveNotYet = { open: open, bind: bind, SCREENS: SCREENS };
})(window);

</script>

<script>
/* 각 화면의 구동부. 이름만 등록하고 부르지는 않는다 — 라우터가 부른다 */

/*
 * 대표페이지의 "지금 모집 중인 프로젝트".
 *
 * browse.html 과 **같은 데이터·같은 규칙·같은 카드**를 쓴다. 하드코딩하면
 * 대표페이지에서 본 것과 목록에서 본 것이 달라진다.
 */

  /*
   * 기획전 배너 슬라이드.
   *
   * 시안은 "1 / 5" 가 표시만이고 넘어가지 않았다. 실제로 넘어가게 만들되
   * **자동으로 넘기지 않는다** — 읽는 속도를 화면이 정하면 안 되고,
   * 자동 전환은 스크린리더 사용자에게 특히 불친절하다.
   * `prefers-reduced-motion` 이면 CSS 가 transition 을 0 으로 만들어 즉시 바뀐다.
   */
  window.PactFiveInit = window.PactFiveInit || {};
window.PactFiveInit = window.PactFiveInit || {};
window.PactFiveInit.main = function () {
  "use strict";
  /* ── 모집 중인 프로젝트 ── */var slot = document.getElementById("homeGrid");
  if (!slot) return;
  // 규칙 10 이 이미 마감된 것을 뺀다. 대표페이지는 앞의 6건만 보여준다
  var res = window.PactFiveEngine.list({ sortBy: "latest" });
  slot.innerHTML = res.items.slice(0, 6).map(window.PactFiveEngine.cardHTML).join("");
  window.PactFiveBookmarks.bind();
  window.PactFiveNotYet.bind();
  // 헤더의 오른쪽은 로그인 여부에 따라 다르다. 세션이 바뀌면 다시 칠한다
  window.PactFiveSession.bind();
  window.PactFiveSession.paintHeader();
  document.addEventListener("pactfive:session", function () {
    window.PactFiveSession.paintHeader();
  });

  /*
   * 검색 폼을 해시로 넘긴다.
   *
   * `method="get"` 은 `?keyword=` 를 만드는데, 목록 화면은 조건을 해시에서 읽는다
   * (정적 파일이라 서버가 없고 해시가 file:// 에서도 살아남기 때문이다).
   * 자바스크립트가 꺼져 있어도 `browse.html` 까지는 가도록 form 은 그대로 둔다.
   */
  var form = document.querySelector(".search");
  if (form) {
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var v = document.getElementById("q").value.trim();
      location.href = "#/projects?" + (v ? "keyword=" + encodeURIComponent(v) : "#");
    });
  }

  /* ── 요약 카드 ── */
  window.PactFiveResume.bind();
  window.PactFiveResume.render();

  /* ── 추천 전문가 ── */
  var eslot = document.getElementById("homeExperts");
  if (eslot) {
    // 평점순 앞의 4명. 목록 화면과 같은 카드·같은 순서 규칙을 쓴다
    eslot.innerHTML = window.PactFiveExperts.list({ sortBy: "rating" })
      .items.slice(0, 4).map(window.PactFiveExperts.cardHTML).join("");
  }

  /* ── 기획전 슬라이드 ── */
    var view = document.querySelector(".promo__view");
    if (!view) return;
    var track = view.querySelector(".promo__track");
    var slides = track.querySelectorAll(".banner");
    var count = document.querySelector(".promo__count");
    var at = 0;

    function show(next) {
      at = (next + slides.length) % slides.length;
      track.style.transform = "translateX(" + -at * 100 + "%)";
      count.textContent = at + 1 + " / " + slides.length;
      // 보이지 않는 슬라이드는 탭 순서에서 뺀다. 안 그러면 화면 밖으로 포커스가 간다
      slides.forEach(function (s, i) { s.inert = i !== at; });
    }

    document.querySelectorAll(".promo__nav button").forEach(function (b) {
      b.addEventListener("click", function () { show(at + Number(b.dataset.dir)); });
    });
    view.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") { show(at + 1); }
      if (e.key === "ArrowLeft") { show(at - 1); }
    });

    show(0);
  };
// 자기 화면일 때만 스스로 돈다. 세 화면을 한 파일로 묶었을 때 서로를 건드리지 않는다
if (document.getElementById("homeGrid")) window.PactFiveInit.main();


/*
 * SCR-B01 목록 화면을 실제로 동작시킨다.
 *
 * 조건은 전부 **주소창에 남긴다.** 그래야 뒤로 가기가 동작하고, 걸러 놓은 화면을
 * 링크로 넘길 수 있다. 대표페이지의 검색창·카테고리 타일도 같은 주소로 들어온다.
 *
 * 규칙 60 — 조건이 바뀌면 즉시 반영하고 page 를 1 로 되돌린다.
 *           3페이지를 보다 조건을 좁히면 그 페이지가 비어 있을 수 있다.
 * 규칙 61 — "필터 초기화"는 필터만 되돌리고 **검색어와 정렬은 남긴다.**
 */
window.PactFiveInit = window.PactFiveInit || {};
window.PactFiveInit.browse = function () {
  "use strict";
  var E = window.PactFiveEngine;
  var $ = function (id) { return document.getElementById(id); };

  /* ── 주소 ↔ 조건 ─────────────────────────────────────── */

  // 조건은 **해시**에 둔다. 정적 파일이라 서버가 없고, 해시는 file:// 에서도
  // 미리보기 도구에서도 그대로 살아남는다. 뒤로 가기도 동작한다.
  function readQuery() {
    var u = new URLSearchParams((window.__pactfiveQuery || ""));
    return {
      keyword: u.get("keyword") || "",
      category: u.get("category") || "",
      skills: (u.get("skills") || "").split(",").filter(Boolean),
      minBudget: Number(u.get("minBudget")) || 0,
      maxBudget: Number(u.get("maxBudget")) || 0,
      includeClosed: u.get("closed") === "1",
      savedOnly: u.get("saved") === "1",
      sortBy: u.get("sortBy") || "latest",
      page: Number(u.get("page")) || 1,
    };
  }

  function writeQuery(q, replace) {
    var u = new URLSearchParams();
    if (q.keyword) u.set("keyword", q.keyword);
    if (q.category) u.set("category", q.category);
    if (q.skills.length) u.set("skills", q.skills.join(","));
    if (q.minBudget) u.set("minBudget", q.minBudget);
    if (q.maxBudget) u.set("maxBudget", q.maxBudget);
    if (q.includeClosed) u.set("closed", "1");
    if (q.savedOnly) u.set("saved", "1");
    if (q.sortBy !== "latest") u.set("sortBy", q.sortBy);
    if (q.page > 1) u.set("page", q.page);
    var url = "#/projects" + (u.toString() ? "?" + u : "");
    history[replace ? "replaceState" : "pushState"](null, "", url);
  }

  /* ── 조건 → 컨트롤 ───────────────────────────────────── */

  function fillControls(q) {
    $("q").value = q.keyword;
    document.querySelectorAll('input[name="cat"]').forEach(function (r) {
      r.checked = r.value === q.category;
    });
    document.querySelectorAll('input[name="skill"]').forEach(function (c) {
      c.checked = q.skills.indexOf(c.value) !== -1;
    });
    $("minBudget").value = q.minBudget || "";
    $("maxBudget").value = q.maxBudget || "";
    document.querySelectorAll('input[name="rs"]').forEach(function (r) {
      r.checked = r.value === (q.includeClosed ? "all" : "open");
    });
    document.querySelectorAll("[data-sort]").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.sort === q.sortBy ? "true" : "false");
    });
  }

  /* ── 컨트롤 → 조건 ───────────────────────────────────── */

  function collect() {
    var checkedCat = document.querySelector('input[name="cat"]:checked');
    var pressed = document.querySelector('[data-sort][aria-pressed="true"]');
    return {
      keyword: $("q").value.trim(),
      category: checkedCat ? checkedCat.value : "",
      skills: Array.prototype.map.call(
        document.querySelectorAll('input[name="skill"]:checked'),
        function (c) { return c.value; },
      ),
      minBudget: Number(String($("minBudget").value).replace(/[^0-9]/g, "")) || 0,
      maxBudget: Number(String($("maxBudget").value).replace(/[^0-9]/g, "")) || 0,
      includeClosed: (document.querySelector('input[name="rs"]:checked') || {}).value === "all",
      savedOnly: readQuery().savedOnly,
      sortBy: pressed ? pressed.dataset.sort : "latest",
      page: 1,
    };
  }

  /* ── 그리기 ─────────────────────────────────────────── */

  function render() {
    var q = readQuery();
    fillControls(q);

    var res = E.list(q);
    $("count").innerHTML = q.savedOnly
      ? '저장한 프로젝트 <b class="num">' + res.totalCount + "</b>건" +
        ' <a class="sec__more" href="#/projects?" style="margin-left:var(--gap-3)">전체 목록 보기 ›</a>'
      : '조건에 맞는 프로젝트 <b class="num">' + res.totalCount + "</b>건";

    $("grid").innerHTML = res.items.map(E.cardHTML).join("");
    $("grid").hidden = res.totalCount === 0;

    // 규칙 — 결과가 없는 것은 오류가 아니다. 무엇을 할 수 있는지 함께 준다
    var hasCondition = q.keyword || q.category || q.skills.length || q.minBudget || q.maxBudget;
    $("empty").hidden = res.totalCount > 0;
    $("empty").innerHTML = res.totalCount > 0 ? "" :
      q.savedOnly && !hasCondition
        // engagement 규칙 15 — 비어 있는 것은 오류가 아니다. 다음에 할 일을 함께 준다
        ? '<div class="empty" role="status">' +
            "<h3>저장한 프로젝트가 없습니다</h3>" +
            "<p>카드의 별을 누르면 여기 모입니다.</p>" +
            '<a class="btn primary" href="#/projects?">프로젝트 둘러보기</a>' +
          "</div>"
        : '<div class="empty" role="status">' +
            "<h3>조건에 맞는 프로젝트가 없습니다</h3>" +
            "<p>" + (hasCondition ? "검색어나 필터를 조정해 보세요." : "지금은 모집 중인 프로젝트가 없습니다.") + "</p>" +
            (hasCondition ? '<button class="btn secondary sm" id="clearAll" type="button">조건 모두 지우기</button>' : "") +
          "</div>";

    renderPager(res);
    document.title = (q.keyword ? q.keyword + " — " : "") + "프로젝트 찾기 · PactFive";
  }

  function renderPager(res) {
    if (res.totalPages <= 1) { $("pager").innerHTML = ""; return; }
    var html = "";
    if (res.page > 1) html += '<button type="button" data-page="' + (res.page - 1) + '" aria-label="이전 페이지">‹</button>';
    for (var i = 1; i <= res.totalPages; i++) {
      html += '<button type="button" data-page="' + i + '"' +
        (i === res.page ? ' aria-current="page"' : "") + ">" + i + "</button>";
    }
    if (res.page < res.totalPages) html += '<button type="button" data-page="' + (res.page + 1) + '" aria-label="다음 페이지">›</button>';
    $("pager").innerHTML = html;
  }

  /* ── 반응 ───────────────────────────────────────────── */

  function apply() {
    writeQuery(collect());
    render();
  }

  $("searchForm").addEventListener("submit", function (e) {
    e.preventDefault();
    apply();
  });

  // 규칙 60 — 필터는 즉시 반영한다. "적용" 버튼을 따로 두지 않는다
  document.querySelector(".filters").addEventListener("change", apply);
  document.querySelector(".filters").addEventListener("input", function (e) {
    if (e.target.id === "minBudget" || e.target.id === "maxBudget") apply();
  });

  document.querySelector(".sorts").addEventListener("click", function (e) {
    var b = e.target.closest("[data-sort]");
    if (!b) return;
    document.querySelectorAll("[data-sort]").forEach(function (x) {
      x.setAttribute("aria-pressed", x === b ? "true" : "false");
    });
    apply();
  });

  $("pager").addEventListener("click", function (e) {
    var b = e.target.closest("[data-page]");
    if (!b) return;
    var q = readQuery();
    q.page = Number(b.dataset.page);
    writeQuery(q);
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // 규칙 61 — 필터 4종만 되돌린다. 검색어와 정렬은 남긴다 —
  // 사용자가 입력한 것을 예고 없이 버리지 않는다
  $("reset").addEventListener("click", function () {
    var q = readQuery();
    q.category = ""; q.skills = []; q.minBudget = 0; q.maxBudget = 0; q.includeClosed = false;
    q.page = 1;
    writeQuery(q);
    render();
  });

  document.addEventListener("click", function (e) {

window.PactFiveInit = window.PactFiveInit || {};

  function render() {

      '<div class="empty" role="status" style="margin-top:var(--gap-7)">' +

        "<p>주소가 바뀌었거나 삭제된 프로젝트입니다.</p>" +
        '<a class="btn primary" href="#/projects">프로젝트 찾기</a>' +

   *   18 삭제되지 않음 · OPEN · 자기 자신 아님
   *   20 1순위 카테고리+기술 겹침, 2순위 카테고리, 3순위 기술
   *   21 같은 순위 안에서는 최근 등록순
   *   22 4건 고정  23 모자라면 있는 만큼  24 하나도 없으면 섹션을 감춘다
   */
  function recommend() {
    var pool = D.PROJECTS.filter(function (x) {
      return x.id !== p.id && E.effectiveStatus(x) === "OPEN";
    });
    function tier(x) {
      var sameCat = x.category === p.category;
      var shared = x.skills.filter(function (s) { return p.skills.indexOf(s) !== -1; });
      if (sameCat && shared.length) return { t: 1, why: D.categoryName(x.category) + " · " + D.skillName(shared[0]) + " 가 같아요" };
      if (sameCat) return { t: 2, why: D.categoryName(x.category) + " 가 같아요" };
      if (shared.length) return { t: 3, why: D.skillName(shared[0]) + " 가 같아요" };
      return { t: 9, why: "" };
    }
    return pool
      .map(function (x) { var r = tier(x); return { p: x, t: r.t, why: r.why }; })
      .filter(function (x) { return x.t < 9; })
      .sort(function (a, b) {
        if (a.t !== b.t) return a.t - b.t;
        return new Date(b.p.createdAt) - new Date(a.p.createdAt);
      })
      .slice(0, 4);
  }

          '<div class="kv"><span class="kv__k">모집 기간</span>' +
            '<span class="kv__v num">' +
              (p.startAt ? p.startAt.slice(0, 10).replace(/-/g, ".") : "즉시 시작") + " — " + dl.abs +
            "</span></div>" +
          '<div class="kv"><span class="kv__k">필요한 기술</span><span class="kv__v">' +
            p.skills.map(function (s) { return '<span class="chip">' + E.esc(D.skillName(s)) + "</span>"; }).join("") +
          "</span></div>" +
          '<div class="kv"><span class="kv__k">지원 현황</span>' +
            '<span class="kv__v num">지원 ' + p.applicationCount + "건</span></div>" +
        "</section>" +

        // 규칙 24 — 후보가 없으면 섹션 자체를 감춘다. 빈 제목만 남기지 않는다
        (recos.length === 0 ? "" :
          '<section><h2 class="h2" style="margin-bottom:var(--gap-3)">추천 프로젝트</h2>' +
            '<div class="reco">' +
              recos.map(function (r) {
                var rs = E.STATUS_TEXT[E.effectiveStatus(r.p)];
                return '<article class="card">' +
                  '<h3><a href="#/detail?id=' + r.p.id + '">' + E.esc(r.p.title) + "</a></h3>" +
                  '<span class="b num">' + E.won(r.p.budget) + "</span>" +
                  // 규칙 28 — 점수·순위값은 내보내지 않는다. 무엇이 겹쳤는지만 말한다
                  '<span class="caption">' + E.esc(r.why) + "</span>" +
                  '<span class="badge ' + rs.cls + '" style="align-self:flex-start">' + rs.label + "</span>" +
                "</article>";
              }).join("") +
            "</div></section>") +
      "</div>" +

      '<aside class="side">' +
        '<div class="card client">' +
          '<span class="avatar">' + E.esc(c.name.slice(0, 1)) + "</span>" +
          "<span>" +
            '<span class="client__name">' + E.esc(c.name) + "</span><br />" +
            '<span class="client__meta num">' + rate + "</span>" +
          "</span>" +

        '<div class="card apply">' +

  document.title = p.title + " · PactFive";

  }

window.PactFiveInit = window.PactFiveInit || {};
window.PactFiveInit.experts = function () {
  "use strict";
  var X = window.PactFiveExperts;
  var $ = function (id) { return document.getElementById(id); };

  function readQuery() {
    var u = new URLSearchParams((window.__pactfiveQuery || location.hash.slice(1)) || "");
    return {
      category: u.get("category") || "",
      skills: (u.get("skills") || "").split(",").filter(Boolean),
      sortBy: u.get("sortBy") || "rating",
      page: Number(u.get("page")) || 1,
    };
  }

  function writeQuery(q) {
    var u = new URLSearchParams();
    if (q.category) u.set("category", q.category);
    if (q.skills.length) u.set("skills", q.skills.join(","));
    if (q.sortBy !== "rating") u.set("sortBy", q.sortBy);
    if (q.page > 1) u.set("page", q.page);
    location.hash = u.toString() ? "#" + u : "#";
  }

  function fill(q) {
    document.querySelectorAll('input[name="cat"]').forEach(function (r) {
      r.checked = r.value === q.category;
    });
    document.querySelectorAll('input[name="skill"]').forEach(function (c) {
      c.checked = q.skills.indexOf(c.value) !== -1;
    });
    document.querySelectorAll("[data-sort]").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.sort === q.sortBy ? "true" : "false");
    });
  }

  function collect() {
    var cat = document.querySelector('input[name="cat"]:checked');
    var pressed = document.querySelector('[data-sort][aria-pressed="true"]');
    return {
      category: cat ? cat.value : "",
      skills: Array.prototype.map.call(
        document.querySelectorAll('input[name="skill"]:checked'),
        function (c) { return c.value; },
      ),
      sortBy: pressed ? pressed.dataset.sort : "rating",
      page: 1, // 조건이 바뀌면 1페이지로. 3페이지에서 좁히면 빈 화면이 나온다
    };
  }

  function render() {
    var q = readQuery();
    fill(q);
    var res = X.list(q);

    $("count").innerHTML = '조건에 맞는 전문가 <b class="num">' + res.totalCount + "</b>명";
    $("grid").innerHTML = res.items.map(X.cardHTML).join("");
    $("grid").hidden = res.totalCount === 0;

    var hasCondition = q.category || q.skills.length;
    $("empty").hidden = res.totalCount > 0;
    $("empty").innerHTML = res.totalCount > 0 ? "" :
      '<div class="empty" role="status">' +
        "<h3>조건에 맞는 전문가가 없습니다</h3>" +
        "<p>기술을 여러 개 고르면 전부 만족하는 사람만 나옵니다. 하나씩 빼 보세요.</p>" +
        (hasCondition ? '<button class="btn secondary sm" id="clearAll" type="button">조건 모두 지우기</button>' : "") +
      "</div>";

    var html = "";
    if (res.totalPages > 1) {
      for (var i = 1; i <= res.totalPages; i++) {
        html += '<button type="button" data-page="' + i + '"' +
          (i === res.page ? ' aria-current="page"' : "") + ">" + i + "</button>";
      }
    }
    $("pager").innerHTML = html;
  }

  function apply() { writeQuery(collect()); render(); }

  $("filters").addEventListener("change", apply);
  document.querySelector(".sorts").addEventListener("click", function (e) {
    var b = e.target.closest("[data-sort]");
    if (!b) return;
    document.querySelectorAll("[data-sort]").forEach(function (x) {
      x.setAttribute("aria-pressed", x === b ? "true" : "false");
    });
    apply();
  });
  $("pager").addEventListener("click", function (e) {
    var b = e.target.closest("[data-page]");
    if (!b) return;
    var q = readQuery(); q.page = Number(b.dataset.page);
    writeQuery(q); render(); window.scrollTo({ top: 0, behavior: "smooth" });
  });
  $("reset").addEventListener("click", function () {
    writeQuery({ category: "", skills: [], sortBy: readQuery().sortBy, page: 1 });
    render();
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest("#clearAll")) return;
    location.hash = "#";
    render();
  });

  window.PactFiveSession.paintHeader();
  render();
};

/*
 * 마이페이지.
 *
 * 역할에 따라 탭이 다르다. 누를 수 없는 탭을 두지 않는다 —
 * 프리랜서에게 "내 프로젝트"는 의뢰인 화면이고, 의뢰인에게 "저장한 프로젝트"는
 * 북마크가 프리랜서 기능이라 의미가 없다 (engagement 규칙 5·30).
 */
window.PactFiveInit = window.PactFiveInit || {};
window.PactFiveInit.mypage = function () {
  "use strict";
  var E = window.PactFiveEngine, D = window.PactFiveData;
  var S = window.PactFiveSession, B = window.PactFiveBookmarks;
  var root = document.getElementById("my");

  var TABS = {
    FREELANCER: [
      { id: "saved", label: "저장한 프로젝트" },
      { id: "applied", label: "내 지원", notyet: "apply" },
    ],
    CLIENT: [
      { id: "projects", label: "내 프로젝트" },
      { id: "applicants", label: "받은 지원", notyet: "apply" },
    ],
  };

  function tabOf() {
    return new URLSearchParams((window.__pactfiveQuery || location.hash.slice(1)) || "").get("tab");
  }

  function render() {
    var u = S.user();

    // 비로그인 — 로그인 화면으로 떠넘기지 않고 여기서 이유를 말한다
    if (!u) {
      root.innerHTML =
        '<div class="empty" role="status" style="margin-top:var(--gap-6)">' +
          "<h3>로그인하면 볼 수 있습니다</h3>" +
          "<p>저장한 프로젝트와 지원 현황은 본인만 볼 수 있습니다.</p>" +
          '<button class="btn primary" type="button" data-notyet="login">로그인</button>' +
        "</div>";
      return;
    }

    var tabs = TABS[u.role];
    var at = tabs.filter(function (t) { return t.id === tabOf(); })[0] || tabs[0];

    root.innerHTML =
      '<div class="my__head">' +
        '<span class="my__avatar" aria-hidden="true">' + E.esc(u.name.slice(0, 1)) + "</span>" +
        '<span class="my__who">' +
          "<b>" + E.esc(u.name) + "</b>" +
          '<span class="my__role">' + (u.role === "CLIENT" ? "의뢰인" : "프리랜서") + "</span>" +
          "<p>" + (u.org ? E.esc(u.org) : "프로필이 아직 비어 있습니다") + "</p>" +
        "</span>" +
      "</div>" +

      '<div class="tabs" role="tablist">' +
        tabs.map(function (t) {
          return '<button type="button" role="tab" data-tab="' + t.id + '"' +
            ' aria-selected="' + (t.id === at.id ? "true" : "false") + '">' + t.label + "</button>";
        }).join("") +
      "</div>" +

      '<div id="panel"></div>';

    panel(at);
  }

  function panel(t) {
    var box = document.getElementById("panel");

    // 아직 없는 화면은 자리만 잡고 담당자를 말한다. 빈 화면을 그냥 두지 않는다
    if (t.notyet) {
      var s = window.PactFiveNotYet.SCREENS[t.notyet];
      box.innerHTML =
        '<div class="empty" role="status">' +
          "<h3>" + t.label + " 화면은 아직 없습니다</h3>" +
          "<p>담당 " + s.owner + " · 명세 <code>" + s.where + "</code></p>" +
          '<a class="btn secondary" href="#/projects">프로젝트 찾기</a>' +
        "</div>";
      return;
    }

    // SCR-B07 내 프로젝트 — 등록 의뢰인만 본다 (규칙 17)
    if (t.id === "projects") {
      box.innerHTML =
        '<div class="acts" style="margin:0 0 var(--gap-4);justify-content:flex-end">' +
          '<a class="btn primary" href="#/register">프로젝트 등록</a>' +
        "</div>" +
        window.PactFiveManage.listHTML();
      return;
    }

    // 저장한 프로젝트 (engagement 규칙 12·13·15)
    var res = E.list({ savedOnly: true, includeClosed: true, sortBy: "latest" });
    box.innerHTML = res.totalCount === 0
      ? '<div class="empty" role="status">' +
          "<h3>저장한 프로젝트가 없습니다</h3>" +
          "<p>카드의 별을 누르면 여기 모입니다.</p>" +
          '<a class="btn primary" href="#/projects">프로젝트 둘러보기</a>' +
        "</div>"
      : '<div class="grid3 enter">' + res.items.map(E.cardHTML).join("") + "</div>" +
        // 규칙 13 — 마감된 것도 남는다. 공개 목록과 반대인 이유를 적어 둔다
        '<p class="my__note">마감된 프로젝트도 지울 때까지 남습니다. ' +
        "공개 목록에서는 빠지지만 내가 담아둔 것은 내가 지웁니다.</p>";
  }

  root.addEventListener("click", function (e) {
    var act = e.target.closest("[data-act]");
    if (act && !act.disabled) {
      e.preventDefault();
      var id = act.getAttribute("data-act");
      var p = E.find(act.getAttribute("data-id"));
      // 되돌릴 수 있는 것은 바로 간다. 전부 확인을 붙이면 확인이 무뎌진다
      if (id === "EDIT") { location.href = "#/edit?id=" + p.id; return; }
      if (id === "REOPEN_RECRUITMENT") { location.href = "#/reopen?id=" + p.id; return; }
      window.PactFiveManage.ask(id, p);
      return;
    }
    var b = e.target.closest("[data-tab]");
    if (!b) return;
    location.hash = "tab=" + b.getAttribute("data-tab");
    render();
  });

  document.addEventListener("pactfive:session", function () {
    S.paintHeader();
    render();
  });
  document.addEventListener("pactfive:bookmark", function () {
    if (document.querySelector('[data-tab="saved"][aria-selected="true"]')) render();
  });

  S.paintHeader();
  render();
};

<script>
/*
 * 세 화면을 한 파일에서 갈아 끼운다.
 *
 * 리포에서는 파일 세 개가 링크로 이어져 있다. 아티팩트는 한 페이지뿐이라
 * 마크업을 template 에 담아 두고 해시에 따라 하나만 꺼내 붙인다.
 * 붙인 뒤에 그 화면의 구동부를 다시 부른다 — 안 부르면 껍데기만 남는다.
 *
 *   #/                 대표페이지
 *   #/projects?...     목록 (조건은 그대로 물음표 뒤에)
 *   #/detail?id=...    상세
 */
(function () {
  "use strict";
  var screen = document.getElementById("screen");
  var ROUTES = {"/":"main","/projects":"browse","/detail":"detail","/experts":"experts","/expert":"expert","/mypage":"mypage","/register":"register","/guide":"guide","/edit":"edit","/reopen":"reopen"};

  function parse() {
    // slice 로 읽는다. 아래 5단계의 일괄 치환이 replace(/^#/) 형태를 노리므로
    // 같은 형태로 쓰면 라우터가 자기 출력을 다시 읽게 된다
    var h = location.hash.slice(1) || "/";
    var at = h.indexOf("?");
    return { path: at < 0 ? h : h.slice(0, at), query: at < 0 ? "" : h.slice(at + 1) };
  }

  var current = null;

  function show() {
    var r = parse();
    var name = ROUTES[r.path] || "main";

    // 화면 안 코드가 location.hash 에서 조건을 읽는다. 경로를 뺀 값만 보이게 맞춘다
    window.__pactfiveQuery = r.query;

    if (current !== name) {
      screen.innerHTML = document.getElementById("tpl-" + name).innerHTML;
      // 화면마다 CSS 를 가둬 두었다. 어느 화면인지 여기서 알려 준다
      screen.className = "route-" + name;
      current = name;
    }
    window.PactFiveInit[name]();
    window.PactFiveBookmarks.bind();
    window.PactFiveNotYet.bind();
    window.PactFiveSession.bind();
    window.PactFiveSession.paintHeader();
  }

  window.addEventListener("hashchange", show);
  if (!location.hash) location.replace("#/");
  show();
})();
</script>
